name: elsewhere
description: "Elsewhere — an editorial travel journal for slow places, field films, and the light in between."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
    - assets/grain.png

  fonts:
    - family: DMSerif
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#b9502f"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#b9502f"
    theme_color: "#1b1a16"
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256

flutter_native_splash:
  color: "#f3ecdf"
  color_dark: "#141712"
  image: assets/splash_mark.png
  image_dark: assets/splash_mark.png
  android_12:
    color: "#f3ecdf"
    color_dark: "#141712"
    image: assets/splash_mark_12.png
    image_dark: assets/splash_mark_12.png
  web: true
  fullscreen: true
